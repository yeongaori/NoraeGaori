services:
  noraegaori:
    image: ghcr.io/yeongaori/noraegaori:${NORAEGAORI_TAG:-latest}
    platform: ${NORAEGAORI_PLATFORM:-linux/amd64}
    container_name: noraegaori-bot
    restart: unless-stopped

    # Environment variables (or use .env file)
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - DISCORDGO_DEBUG=${DISCORDGO_DEBUG:-false}

    # Mount volumes for persistence
    volumes:
      - ./config:/app/config             # Config files
      - ./data:/app/data                 # Database (read-write)
      - ./lib:/app/lib
      - ./locales:/app/locales

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "noraegaori"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
