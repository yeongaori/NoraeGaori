name: Docker Publish

on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string
      push:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/386
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/yeongaori/NoraeGaori
          cache-from: type=gha
          cache-to: type=gha,mode=max
