name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci-checks.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: make all

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/noraegaori-*

  docker:
    name: Docker
    needs: [ci, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      kind: Release
      push: true
      tags: ghcr.io/yeongaori/noraegaori:${{ github.ref_name }},ghcr.io/yeongaori/noraegaori:latest

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          artifacts: "artifacts/*.tar.gz,artifacts/*.zip,artifacts/*.sha256"
