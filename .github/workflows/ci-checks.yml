name: CI

on:
  workflow_call:

jobs:
  test:
    name: Test
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install ffmpeg
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if timeout 240 bash -c '
            sudo apt-get -o Acquire::Retries=3 \
                         -o Acquire::http::Timeout=30 \
                         -o DPkg::Lock::Timeout=60 update &&
            sudo apt-get -o DPkg::Lock::Timeout=60 install -y ffmpeg
          '; then
            ffmpeg -version | head -1
          else
            echo "::warning title=ffmpeg unavailable::apt failed or timed out; tests that drive ffmpeg will skip"
          fi

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test -tags testhooks -race ./...

      - name: Run tests repeatedly
        env:
          CGO_ENABLED: "1"
        run: go test -tags testhooks -count=3 ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  security:
    name: Security
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run govulncheck
        run: govulncheck -tags testhooks ./...

      - name: Run gosec
        run: gosec -tags testhooks -quiet ./...
