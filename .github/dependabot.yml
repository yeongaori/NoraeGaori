version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/bwmarrin/discordgo
    groups:
      go:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      docker:
        update-types:
          - minor
          - patch
